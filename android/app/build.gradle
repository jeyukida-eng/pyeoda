plugins { id 'com.android.application' }
android {
    namespace 'com.pyoda.galaxydefense'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig { applicationId 'com.pyoda.galaxydefense'; minSdk 26; targetSdk 36; versionCode 1; versionName '1.0.0' }
    def uploadStore = System.getenv('PYODA_UPLOAD_STORE')
    signingConfigs {
        if (uploadStore) {
            upload {
                storeFile file(uploadStore)
                storePassword System.getenv('PYODA_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('PYODA_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('PYODA_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.preview'; versionNameSuffix '-preview' }
        release { minifyEnabled false; if (uploadStore) signingConfig signingConfigs.upload }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.14.0' }
tasks.register('copyGameIcons', Copy) {
    from '../../games/galaxy-defense'
    include 'icon-*.png'
    into 'src/main/assets'
}
tasks.register('copyLauncherIcon', Copy) {
    from '../../games/galaxy-defense/icon-512.png'
    into 'src/main/res/drawable'
    rename { 'ic_launcher.png' }
}
tasks.named('preBuild').configure { dependsOn 'copyGameIcons', 'copyLauncherIcon' }
