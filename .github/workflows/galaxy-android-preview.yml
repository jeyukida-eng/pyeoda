name: Galaxy Android Preview
on:
  push:
    branches: [galaxy-android-20261015, release/android-1.2.2-20261016, feature/galaxy-i18n-1.2.3-20261016, main]
    paths: ['android/**', 'games/galaxy-defense/**', '.github/workflows/galaxy-android-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Validate separate web demo and Android full edition
        run: |
          node --check games/galaxy-defense/i18n.js
          node --check android/app/src/main/assets/i18n.js
          # Edition-specific translations may differ. Never overwrite full Android assets
          # with the publicly limited web demo during any build.
          grep -q 'const WEB_DEMO = true;' games/galaxy-defense/index.html
          if grep -q 'const WEB_DEMO = true;' android/app/src/main/assets/index.html; then
            echo 'ERROR: Android paid edition must not contain web-demo restrictions.'
            exit 1
          fi
      - name: Build preview APK and unsigned AAB
        run: gradle -p android :app:assembleDebug :app:bundleRelease :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: galaxy-android-preview
          retention-days: 14
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/reports/lint-results-debug.html
